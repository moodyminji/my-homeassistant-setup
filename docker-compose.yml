services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    # host networking is required for device discovery (mDNS/SSDP/DHCP) of
    # local Wi-Fi and network devices
    network_mode: host
    # privileged is required for USB (Zigbee/Z-Wave dongle) and Bluetooth
    # passthrough from the host
    privileged: true
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ}

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      # set ZIGBEE_DONGLE_PATH in .env to the coordinator's /dev/serial/by-id/...
      # path once it's plugged in (see .env comment) before starting this service
      - ${ZIGBEE_DONGLE_PATH}:/dev/ttyACM0
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ}

  asterisk:
    container_name: asterisk
    # Pinned: the project has had breaking releases (5.0, 5.1, 6.0). Bump deliberately.
    image: ghcr.io/tech7fox/asterisk-hass-addon:6.2.0
    restart: unless-stopped
    # host networking: SIP 5060, AMI 5038 (localhost-only), WebSocket 8088 for the
    # browsers (reached through caddy at /ws), and the RTP media range UDP 10000-20000.
    # Publishing 10k UDP ports through Docker is slow and breaks ICE candidate addresses.
    network_mode: host
    # upstream's compose sets this; its s6 init expects a tty
    tty: true
    environment:
      - TZ=${TZ}
    volumes:
      # config.json + custom/ overrides (see asterisk/generate-secrets.sh)
      - ./asterisk/config:/config
      - ./asterisk/media:/media

  caddy:
    container_name: caddy
    build: ./caddy
    restart: unless-stopped
    # host networking: serves 443 to the tablets and reaches HA (itself on the host
    # network, 127.0.0.1:8123) and Asterisk's ws port 8088 without extra plumbing.
    network_mode: host
    # DUCKDNS_TOKEN lives in .env.secrets (gitignored; copy .env.secrets.example)
    env_file: .env.secrets
    environment:
      - SITE_HOST=${SITE_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # certs + ACME account: keep them, or reissuing trips Let's Encrypt rate limits
      - ./caddy/data:/data
      - ./caddy/config:/config
